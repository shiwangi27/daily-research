name: baseline
description: First baseline — a from-scratch TinyGPT learning to sort a short sequence of tokens. AdamW + cosine schedule. The reference every early experiment is measured against.
hypothesis: Establish a reproducible reference point. No knob varied; this IS the reference.
seed: 1234
needs_gpu: false
compare_to: null

data:
  task: sort
  max_train: 4000
  max_eval: 1000
  seq_len: 10
  vocab: 12
  seed: 0

model:
  arch: tiny_gpt
  d_model: 64
  n_heads: 4
  n_layers: 2
  block_size: 32
  dropout: 0.0
  quantize_dynamic: false
  lora:
    enabled: false

train:
  epochs: 8
  batch_size: 64
  loss: cross_entropy
  optimizer: adamw
  lr: 3.0e-3
  weight_decay: 0.01
  scheduler: cosine
  warmup_ratio: 0.1
  grad_clip: 1.0
