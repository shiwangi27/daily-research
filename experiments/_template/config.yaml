# Template / smoke-test config. Copy this folder (or a baseline) to start a day.
# Change EXACTLY ONE knob versus your baseline, then set name / stage / hypothesis / compare_to.
# This tiny pretrain config runs in a few seconds:
#   python3 -m harness.train experiments/_template/config.yaml
name: template-smoke
stage: pretrain
description: Minimal fast run to verify the harness end-to-end (tiny NanoLM on arith).
hypothesis: The harness runs and writes a result.json. Not a real experiment.
seed: 1234
needs_gpu: false
compare_to: null

data: {task: arith, op: add, max_digits: 2, reverse_answer: true, max_train: 800, max_eval: 200, seed: 0}
model: {arch: nanolm, d_model: 32, n_heads: 2, n_layers: 2, block_size: 16, lora: {enabled: false}}
train: {epochs: 2, batch_size: 64, optimizer: adamw, lr: 3.0e-3, scheduler: cosine, warmup_ratio: 0.1}
